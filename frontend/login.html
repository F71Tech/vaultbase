<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ingresar · VaultBase</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .brand-panel { background:
      radial-gradient(60% 60% at 20% 20%, rgba(79,179,232,.35), transparent 70%),
      radial-gradient(50% 50% at 90% 90%, rgba(245,197,66,.22), transparent 70%), var(--surface); }
  </style>
</head>
<body class="min-h-screen">
  <div class="min-h-screen grid lg:grid-cols-2">
    <!-- Panel de marca (solo escritorio) -->
    <aside class="brand-panel hidden lg:flex flex-col justify-between p-12 border-r" style="border-color:var(--border)">
      <a href="/" class="font-display text-2xl font-bold">Vault<span class="text-primary">Base</span></a>
      <div class="rise">
        <h2 class="font-display text-5xl font-bold leading-tight">Cada peso,<br />en su lugar.</h2>
        <p class="muted text-lg mt-4 max-w-md">Gastos, metas, suscripciones y tu sueldo líquido, con la cotización del BCU al día.</p>
      </div>
      <div class="flex gap-6 muted text-sm">
        <span class="flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-primary"></i>Contraseña cifrada</span>
        <span class="flex items-center gap-2"><i data-lucide="landmark" class="w-4 h-4 text-accent"></i>Dólar BCU</span>
      </div>
    </aside>

    <!-- Formulario -->
    <main class="flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-md rise">
        <a href="/" class="lg:hidden block font-display text-3xl font-bold mb-8 text-center">Vault<span class="text-primary">Base</span></a>

        <div class="segmented w-full mb-6" role="tablist">
          <button class="flex-1" data-mode="login" aria-pressed="true" role="tab">Ingresar</button>
          <button class="flex-1" data-mode="register" aria-pressed="false" role="tab">Crear cuenta</button>
        </div>

        <h1 id="title" class="font-display text-3xl font-bold mb-1">¡Hola de nuevo!</h1>
        <p id="subtitle" class="muted mb-6">Ingresá para ver tus finanzas.</p>

        <form id="auth-form" class="space-y-4" novalidate>
          <label class="field" id="name-field" hidden><span>Nombre</span>
            <input class="input" name="name" autocomplete="given-name" maxlength="80" placeholder="¿Cómo te llamamos?" />
          </label>
          <label class="field"><span>Email</span>
            <input class="input" name="email" type="email" autocomplete="email" required placeholder="vos@email.com" />
          </label>
          <label class="field"><span>Contraseña</span>
            <div class="relative">
              <input class="input pr-12" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo 8 caracteres" />
              <button type="button" id="toggle-pass" class="absolute right-2 top-1/2 -translate-y-1/2 btn-icon muted" aria-label="Mostrar contraseña">
                <i data-lucide="eye" class="w-5 h-5"></i>
              </button>
            </div>
          </label>
          <p class="form-error" id="error" role="alert"></p>
          <button class="btn btn-primary w-full" id="submit">Ingresar</button>
        </form>
        <div class="flex items-center gap-3 my-6 muted text-xs"><span class="flex-1 border-t" style="border-color:var(--border)"></span>o<span class="flex-1 border-t" style="border-color:var(--border)"></span></div>
        <button class="btn btn-ghost w-full" id="demo-btn"><i data-lucide="play" class="w-4 h-4"></i>Probar la demo sin registrarme</button>
      </div>
    </main>
  </div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
