<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Metas · VaultBase</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- App instalable (PWA): nombre, ícono y colores cuando se agrega a la pantalla de inicio -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#08152A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="VaultBase" />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    /* Anillo de progreso (ojo: "ring" ya es una clase de Tailwind, por eso "progress-ring"): un círculo SVG cuyo trazo se "dibuja" con stroke-dashoffset */
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
    .progress-ring .track { stroke: var(--surface-2); }
    .progress-ring .value { transition: stroke-dashoffset 1.4s var(--ease); }
  </style>
</head>
<body class="min-h-screen">
  <div class="app-layout mx-auto max-w-6xl px-4 md:flex md:gap-8 pb-28 md:pb-12">
  <aside id="sidebar" class="hidden"></aside>
  <main class="flex-1 min-w-0 pt-6 md:pt-8 space-y-5 md:space-y-6">
    <header class="rise flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="font-display text-3xl font-bold tracking-tight">Metas</h1>
        <p class="muted">Lo que estás juntando y cuándo vas a llegar.</p>
      </div>
      <button class="btn btn-primary" id="add-goal"><i data-lucide="plus" class="w-4 h-4"></i>Nueva meta</button>
    </header>

    <section class="grid grid-cols-3 gap-3 rise" style="animation-delay:.05s">
      <div class="card p-4"><div class="muted text-xs md:text-sm mb-1">Ahorro posible / mes</div>
        <div class="font-display text-lg md:text-2xl font-bold text-accent" id="sum-capacity">$ 0</div></div>
      <div class="card p-4"><div class="muted text-xs md:text-sm mb-1">Va a tus metas</div>
        <div class="font-display text-lg md:text-2xl font-bold text-primary" id="sum-allocated">$ 0</div></div>
      <div class="card p-4"><div class="muted text-xs md:text-sm mb-1">Ya ahorrado</div>
        <div class="font-display text-lg md:text-2xl font-bold" id="sum-saved">$ 0</div></div>
    </section>

    <section id="goals" class="grid md:grid-cols-2 gap-4"></section>
  </main>
  </div>
  <script type="module" src="/js/pages/metas.js"></script>
</body>
</html>
