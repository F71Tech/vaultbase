<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VaultBase</title>

  <!-- Tipografías: Inter (texto) y Space Grotesk (títulos y números) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind por CDN (solo durante el desarrollo; en el deploy lo compilamos) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>

  <!-- Paleta de VaultBase como "tokens" de Tailwind: bg-ink, text-emerald, etc. -->
  <style type="text/tailwindcss">
    @theme {
      --color-ink: #0B1220;
      --color-ink-soft: #131C2E;
      --color-money: #10B981;
      --color-goal: #F59E0B;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-display: "Space Grotesk", "Inter", sans-serif;
    }
  </style>
  <style>
    /* Animación de entrada: el contenido aparece subiendo suavemente */
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    /* Si el usuario pidió menos movimiento en su sistema, lo respetamos */
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
  </style>
</head>
<body class="min-h-screen bg-ink font-sans text-slate-200 antialiased">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-6 px-4 text-center">
    <span class="rise rounded-full border border-money/30 bg-money/10 px-3 py-1 text-xs font-medium text-money">
      Etapa 0 · entorno listo
    </span>
    <h1 class="rise font-display text-5xl font-bold tracking-tight sm:text-6xl" style="animation-delay:.1s">
      Vault<span class="text-money">Base</span>
    </h1>
    <p class="rise max-w-md text-slate-400" style="animation-delay:.2s">
      Tus finanzas personales, claras y bajo control. Pronto: dashboard, metas,
      suscripciones y simulador de compras.
    </p>
    <div class="rise flex flex-wrap justify-center gap-3" style="animation-delay:.3s">
      <a href="/docs" class="rounded-xl bg-money px-5 py-2.5 font-medium text-ink transition hover:-translate-y-0.5 hover:bg-emerald-400">
        Ver la API (/docs)
      </a>
      <span id="status" class="rounded-xl border border-white/10 bg-ink-soft px-5 py-2.5 text-slate-400">
        Consultando servidor…
      </span>
    </div>
  </main>

  <script>
    // Le preguntamos al backend si está vivo y mostramos la respuesta.
    // fetch() hace un pedido HTTP desde el navegador al servidor.
    fetch("/api/health")
      .then((res) => res.json())
      .then((data) => {
        const el = document.getElementById("status");
        el.textContent = `Servidor: ${data.status} ✓`;
        el.classList.add("text-money");
      })
      .catch(() => {
        document.getElementById("status").textContent = "Servidor no responde";
      });
  </script>
</body>
</html>
