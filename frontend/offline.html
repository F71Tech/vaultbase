<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08152A" />
  <title>Sin conexión · VaultBase</title>
  <!-- Sin internet no cargan las fuentes ni Tailwind: esta página trae sus propios estilos -->
  <style>
    html, body { margin: 0; height: 100%; background: #08152A; color: #E6EDF7; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: 24px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: #8C9AB3; margin: 0 0 24px; line-height: 1.5; }
    button { background: #4FB3E8; color: #06233A; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="17" fill="none" stroke="#4FB3E8" stroke-width="5"/>
      <circle cx="32" cy="32" r="5" fill="#F5C542"/>
    </svg>
    <h1>Estás sin conexión</h1>
    <p>VaultBase necesita internet para traer tus datos.<br />Cuando vuelva la señal, tocá el botón.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
